[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "automotive-can-validation-lab"
version = "0.1.0"
description = "A test-driven virtual automotive CAN network and ECU validation lab."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Felipe Rojas" },
]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/automotive_can_validation_lab"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=automotive_can_validation_lab",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=100",
    "-ra",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["automotive_can_validation_lab"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "B",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "SIM",
    "UP",
]

[tool.ruff.lint.isort]
known-first-party = ["automotive_can_validation_lab"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"